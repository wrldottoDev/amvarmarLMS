# IP real del visitante detrás de Cloudflare.
#
# Sin esto, $remote_addr es un servidor de Cloudflare y la IP del cliente
# llega en X-Forwarded-For, que el propio cliente puede inventar: el backend
# tomaba el primer valor de esa lista y cualquiera esquivaba los límites de
# login por IP mandando otra.
#
# `real_ip_header CF-Connecting-IP` solo se cree si la conexión viene de un
# rango de Cloudflare (set_real_ip_from). Una conexión directa al origen
# conserva su IP de verdad aunque mande la cabecera.
#
# Rangos oficiales, bajados el 2026-10-12 de:
#   https://www.cloudflare.com/ips-v4  https://www.cloudflare.com/ips-v6
# Cambian muy de vez en cuando; si Cloudflare agrega uno, las visitas que
# entren por él se verían con la IP de Cloudflare hasta actualizar esta lista.
#
# Se instala en /etc/nginx/snippets/cloudflare-realip.conf y se incluye en el
# server de app.amvarmar.com.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
