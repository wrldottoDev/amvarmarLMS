# Sitio del LMS en el nginx del host. Convive con el del sistema viejo: es un
# server_name distinto y no toca su configuración.
#   sudo cp app.amvarmar.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/app.amvarmar.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d app.amvarmar.com
# certbot agrega el bloque 443 y la redirección desde 80.

server {
    listen 80;
    server_name app.amvarmar.com;

    # Subidas grandes pasan por MinIO directo; esto cubre el resto de la API.
    client_max_body_size 20m;

    # La API va directo al backend, sin pasar por Next.
    location /api/ {
        proxy_pass http://127.0.0.1:58000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AMVI responde por streaming (SSE): sin esto nginx lo entrega de golpe.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:53000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
