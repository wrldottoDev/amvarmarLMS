# Storage (MinIO) para las URLs firmadas: el navegador sube y descarga directo.
# El bucket es privado: sin firma válida MinIO responde 403.
#   sudo certbot --nginx -d archivos.amvarmar.com

server {
    listen 80;
    server_name archivos.amvarmar.com;

    # ADR-0009: PDF hasta 250 MB.
    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:59000;
        proxy_http_version 1.1;
        # La firma incluye el Host: tiene que llegar tal cual.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
