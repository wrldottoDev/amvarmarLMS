# Storage (MinIO) en el mismo dominio, puerto 9443, mientras no exista el DNS
# de archivos.amvarmar.com. Reusa el certificado de app.amvarmar.com, así que
# se instala DESPUÉS de `certbot --nginx -d app.amvarmar.com`.
# El puerto 9443 tiene que estar abierto (ufw y firewall del proveedor).
#   .env: S3_ENDPOINT_URL=https://app.amvarmar.com:9443
# Cuando exista el DNS se reemplaza por archivos.amvarmar.com.conf y se
# cambia S3_ENDPOINT_URL; no hay que migrar nada.

server {
    listen 9443 ssl;
    server_name app.amvarmar.com;

    ssl_certificate /etc/letsencrypt/live/app.amvarmar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.amvarmar.com/privkey.pem;

    # ADR-0009: PDF hasta 250 MB.
    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:59000;
        proxy_http_version 1.1;
        # $http_host lleva el puerto: la firma de las URLs lo incluye y tiene
        # que llegarle a MinIO exactamente igual.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
