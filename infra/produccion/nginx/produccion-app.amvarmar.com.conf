# Sitio FINAL del LMS en app.amvarmar.com (443), para el cutover.
# Reemplaza al sitio del sistema viejo: ese archivo NO se borra, solo se quita
# su enlace de sites-enabled (volver atrás = restaurar ese enlace).
# Reusa el certificado que certbot ya emitió para el dominio.

server {
    listen 80;
    server_name app.amvarmar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.amvarmar.com;

    ssl_certificate /etc/letsencrypt/live/app.amvarmar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.amvarmar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:58000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AMVI responde por streaming (SSE).
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Storage (Garage) en el mismo origen, por la ruta del bucket:
    #   .env: S3_ENDPOINT_URL=https://app.amvarmar.com
    # Las URLs firmadas quedan en el dominio de la app: sin CORS ni un puerto
    # aparte. En el puerto 2053 el navegador pasaba el preflight pero el PUT no
    # llegaba nunca (Cloudflare anuncia HTTP/3 en ese puerto).
    location /amvarmar-documentos/ {
        # PUERTO_STORAGE del compose.
        proxy_pass http://127.0.0.1:59010;
        proxy_http_version 1.1;
        # La firma incluye el host: tiene que llegar tal cual.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # ADR-0009: PDF hasta 250 MB (desde el navegador, Cloudflare corta en 100).
        client_max_body_size 260m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:53000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
