# Sitio FINAL del LMS en app.amvarmar.com (443), para el cutover.
# Reemplaza al sitio del sistema viejo: ese archivo NO se borra, solo se quita
# su enlace de sites-enabled (volver atrás = restaurar ese enlace).
# Reusa el certificado que certbot ya emitió para el dominio.

server {
    listen 80;
    server_name app.amvarmar.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.amvarmar.com;

    ssl_certificate /etc/letsencrypt/live/app.amvarmar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.amvarmar.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:58000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AMVI responde por streaming (SSE).
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:53000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
