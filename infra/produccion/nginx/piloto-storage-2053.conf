# Storage (MinIO) del piloto, puerto 2053 del mismo dominio: Cloudflare lo
# reenvía y el navegador sube y descarga ahí con URLs firmadas.
#   .env: S3_ENDPOINT_URL=https://app.amvarmar.com:2053
# Los contenedores del backend llegan acá sin pasar por Cloudflare
# (extra_hosts en el compose): así la migración de archivos no choca con el
# límite de 100 MB por petición del plan gratuito de Cloudflare.

server {
    listen 2053 ssl;
    server_name app.amvarmar.com;

    ssl_certificate /etc/letsencrypt/live/app.amvarmar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.amvarmar.com/privkey.pem;

    # ADR-0009: PDF hasta 250 MB (desde el navegador, Cloudflare corta en 100).
    client_max_body_size 260m;

    location / {
        proxy_pass http://127.0.0.1:59000;
        proxy_http_version 1.1;
        # $http_host lleva el puerto: la firma de las URLs lo incluye.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
