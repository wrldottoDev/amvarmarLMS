# Piloto del LMS en el MISMO dominio que el sistema viejo, en el puerto 8443.
# app.amvarmar.com (443) es del sistema viejo y no se toca: esto es un server
# aparte en otro puerto, con el mismo certificado. Cloudflare (proxy naranja)
# reenvía 8443 al origen; 9443 no lo reenvía.
#   .env: FRONTEND_BASE_URL=https://app.amvarmar.com:8443
# En el cutover, el sitio de 443 pasa a apuntar al LMS y este se retira.

server {
    listen 8443 ssl;
    server_name app.amvarmar.com;

    # Certificado del sitio del sistema viejo: solo se lee.
    ssl_certificate /etc/letsencrypt/live/app.amvarmar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.amvarmar.com/privkey.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:58000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AMVI responde por streaming (SSE).
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:53000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
