repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Debe coincidir con la de requirements-dev.txt: versiones distintas
    # discrepan entre sí y un commit que pasa aquí puede fallar en CI.
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # --exclude-lines omite los identificadores de revisión de Alembic
        # (hashes hex que el detector de entropía marca siempre). Los archivos
        # de migración se siguen escaneando: una migración de datos sí podría
        # traer un secreto real.
        args:
          - "--baseline"
          - ".secrets.baseline"
          - "--exclude-lines"
          - "^(revision|down_revision|Revision ID|Revises)"
        exclude: ^backend/\.venv/
