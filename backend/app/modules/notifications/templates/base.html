<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ asunto }}</title>
  </head>
  <body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2430;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;">
      <tr>
        <td style="padding:24px 28px 8px;">
          <p style="margin:0;font-size:13px;letter-spacing:1px;color:#6b7280;">AMVARMAR</p>
          <h1 style="margin:8px 0 0;font-size:20px;line-height:1.3;">{{ asunto }}</h1>
        </td>
      </tr>
      <tr>
        <td style="padding:8px 28px 24px;">
          <p style="margin:0 0 20px;font-size:15px;line-height:1.6;">{{ mensaje }}</p>
          <a href="{{ enlace }}" style="display:inline-block;padding:11px 20px;background:#1f2430;color:#ffffff;text-decoration:none;border-radius:6px;font-size:15px;">Entrar al sistema</a>
          <p style="margin:20px 0 0;font-size:12px;color:#6b7280;word-break:break-all;">Si el botón no funciona: {{ enlace }}</p>
        </td>
      </tr>
      <tr>
        <td style="padding:0 28px 24px;border-top:1px solid #e5e7eb;">
          <p style="margin:16px 0 0;font-size:12px;line-height:1.5;color:#6b7280;">
            Mensaje automático; no responda a esta dirección.
            Por seguridad, este correo no incluye datos de sus cargas ni documentos adjuntos.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
